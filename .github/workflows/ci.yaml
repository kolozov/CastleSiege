name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Check formatting with dotnet format
        run: dotnet format whitespace CastleSiege.sln --verify-no-changes
      - name: Check build warnings
        run: dotnet build CastleSiege.sln -warnaserror

  test:
    needs: lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Run unit tests
        run: dotnet test CastleSiege.sln --verbosity normal
